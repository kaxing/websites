<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Optimized for mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Viewer</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 10px;
      margin: 0;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 10px;
      height: 150px;
      font-family: monospace;
      resize: vertical;
      font-size: 16px;
    }
    /* Container for the buttons */
    .button-container {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0;
    }
    /* Hide the default file input */
    #fileInput {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Hidden file input for loading files -->
  <input type="file" id="fileInput" accept=".html">

  <!-- Code Preview Area -->
  <textarea id="sourceArea" placeholder="paste the code here or load the html file"></textarea>

  <!-- UI Buttons -->
  <div class="button-container">
    <button id="loadButton">Load</button>
    <button id="clearButton">Clear</button>
    <button id="pasteButton">Paste</button>
    <button id="viewButton">View</button>
  </div>

  <script>
    // Function to open the HTML content in a new tab using a Blob URL.
    function openHTML(content) {
      const blob = new Blob([content], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    }

    // "Load" button: Trigger the hidden file input.
    document.getElementById('loadButton').addEventListener('click', function() {
      document.getElementById('fileInput').click();
    });

    // File input change: Read the file content and load it into the textarea.
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('sourceArea').value = e.target.result;
      };
      reader.readAsText(file);
    });

    // "Clear" button: Clear the content of the textarea.
    document.getElementById('clearButton').addEventListener('click', function() {
      document.getElementById('sourceArea').value = '';
    });

    // "Paste" button: Read text from the clipboard and place it in the textarea.
    document.getElementById('pasteButton').addEventListener('click', function() {
      navigator.clipboard.readText().then(text => {
        if (!text.trim()) {
          alert('Clipboard is empty or contains no text.');
          return;
        }
        document.getElementById('sourceArea').value = text;
      }).catch(err => {
        console.error('Failed to read clipboard: ', err);
        alert('Failed to read clipboard. Ensure your browser supports the Clipboard API and permissions are granted.');
      });
    });

    // "View" button: Open the content of the textarea in a new tab.
    document.getElementById('viewButton').addEventListener('click', function() {
      const content = document.getElementById('sourceArea').value;
      if (content.trim() === '') {
        alert('No HTML content found.');
        return;
      }
      openHTML(content);
    });
  </script>
</body>
</html>
