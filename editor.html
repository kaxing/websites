<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make-Sense - Plaintext Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js"></script>
    <style>
        :root {
            /* Core brand colors from minimal.codes */
            --signature-color: #FFB300;
            --pantone-black: #1C1C1C;
            --pantone-charcoal: #2E2E2E;
            --pantone-grey-medium: #7F7F7F;
            --pantone-grey-light: #DADADA;
            --editor-bg: #FFFFFF;
            --tab-hover: #F5F5F5;
            --outtee: #F3F1EC;
            
            /* Application variables mapped to brand colors */
            --background: var(--editor-bg);
            --surface: var(--tab-hover);
            --primary: var(--signature-color);
            --text: var(--pantone-charcoal);
            --text-light: var(--pantone-grey-medium);
            --border: var(--pantone-grey-light);
            --shadow: rgba(0,0,0,0.05);
            --transition: all 0.2s ease;
            --radius: 4px;
            --sidebar-width: 240px;
            --max-width: 100%;
            --optimal-width: 1400px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Helvetica Neue", -apple-system, system-ui, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.5;
            height: 100vh;
            display: flex;
            overflow: hidden;
            justify-content: center;
        }
        .app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: var(--max-width);
            overflow: hidden; /* Prevent content from expanding beyond container */
        }
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            width: 100%; /* Ensure container respects parent width */
            min-width: 0; /* Important for flex containers to prevent overflow */
        }
        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            min-width: 0; /* Critical for flex child to prevent overflow */
            overflow: hidden; /* Ensure content doesn't overflow */
        }

        /* Tab System */
        .tab-bar {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--background);
            position: relative;
            height: 38px;
            width: 100%; /* Ensure tab bar respects parent width */
            min-width: 0; /* Important for flex containers */
            overflow: visible; /* Allow content to be visible when scrolled */
        }
        .tabs-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            min-width: 0; /* Prevent container from expanding beyond parent width */
        }
        .tabs {
            display: flex;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            width: 100%;
            scroll-behavior: smooth;
            flex-wrap: nowrap; /* Prevent tabs from wrapping to next line */
            padding-bottom: 1px; /* Avoid border overlap with bottom border */
            max-width: 100%; /* Ensure tabs don't exceed container width */
        }
        .tabs::-webkit-scrollbar {
            display: none;
        }
        .tab-scroll-btn {
            width: 22px;
            min-width: 22px;
            background: var(--background);
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            font-size: 12px;
            border-right: 1px solid var(--border);
            transition: var(--transition);
            opacity: 0.7;
        }
        .tab-scroll-btn:hover {
            opacity: 1;
            color: var(--primary);
        }
        .tab-scroll-btn.disabled {
            opacity: 0.3;
            cursor: default;
            color: var(--text-light);
        }
        .tab {
            padding: 8px 14px;
            white-space: nowrap;
            border-right: 1px solid var(--border);
            cursor: pointer;
            font-size: 13px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            position: relative;
            min-width: 110px;
            max-width: 160px;
            overflow: hidden;
            flex-shrink: 0; /* Prevent tabs from shrinking */
            transition: background-color 0.15s ease;
            height: 38px;
        }
        .tab:hover {
            background-color: var(--tab-hover);
        }
        .tab.active {
            color: var(--pantone-black);
            background: var(--background);
            border-bottom: 2px solid var(--primary);
            font-weight: 500;
        }
        .tab-title {
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            display: inline-block;
            min-width: 0;
            line-height: 1.2;
            user-select: text; /* Allow text selection for better double-click handling */
            cursor: text; /* Indicate text can be edited */
            z-index: 999;
            transition: background-color 0.2s ease;
            padding: 2px 4px;
            margin: -2px -4px;
        }

        /* Visual indicator for tab titles that can be edited */
        .tab-title[data-rename-handler-setup="true"]:hover {
            background-color: rgba(255, 179, 0, 0.05);
            outline: 1px dotted rgba(255, 179, 0, 0.3);
        }
        /* Remove visual indicator */
        .tab-delete {
            opacity: 0;
            margin-left: 6px;
            color: var(--pantone-grey-dark);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }
        .tab:hover .tab-delete {
            opacity: 0.7;
        }
        .tab-delete:hover {
            opacity: 1 !important;
            background-color: rgba(255, 179, 0, 0.1);
            color: var(--pantone-black);
        }
        .tab-edit-input {
            /* Basic positioning */
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            padding: 8px 14px;
            
            /* Text and appearance */
            font-size: 13px;
            font-family: inherit;
            border: none;
            background: var(--pantone-white);
            outline: 2px solid var(--primary);
            box-sizing: border-box;
            color: var(--pantone-black);
            
            /* Layer and visibility */
            z-index: 9999;
            
            /* Simpler and more reliable */
            margin: 0;
            display: block;
            
            /* Minimal.codes style touches */
            border-radius: 2px;
            transition: background-color 0.2s ease;
        }

        /* Animation to draw attention to the input */
        @keyframes flash-border {
            0%, 100% { outline-color: var(--primary); }
            50% { outline-color: red; }
        }
        .new-tab-btn {
            width: 36px;
            height: 38px; /* Match tab bar height */
            background: transparent;
            border: none;
            border-left: 1px solid var(--border);
            color: var(--text-light);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .new-tab-btn:hover {
            color: var(--primary);
            background-color: var(--tab-hover);
        }
        .editor-container { flex: 1; padding: 20px; overflow: hidden; position: relative; }
        #editor { width: 100%; height: 100%; border: none; resize: none; font-size: 16px; line-height: 1.6; color: var(--text); background: transparent; outline: none; padding: 0; }
        /* Sidebar structure */
        .main-container {
            position: relative; /* Needed for proper sidebar positioning */
        }

        /* Container for entire sidebar including header */
        .sidebar-container {
            width: var(--sidebar-width);
            height: 100%;
            display: flex;
            flex-direction: column;
            flex-shrink: 0; /* Prevents sidebar from shrinking */
            background: var(--surface);
            border-left: 1px solid var(--border);
            transition: width 0.28s cubic-bezier(0.4, 0, 0.2, 1); /* Material Design easing for natural motion */
            will-change: width; /* Performance optimization */
            overflow: hidden;
        }

        /* Header containing title and toggle */
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            z-index: 2;
        }

        /* Wrapper for the scrollable content */
        .sidebar-wrapper {
            flex: 1;
            overflow: hidden;
        }

        /* Actual sidebar content */
        .sidebar {
            height: 100%;
            width: 100%;
            overflow-y: auto;
        }

        .sidebar-inner {
            padding: 15px 20px;
        }

        /* Collapsed state */
        .sidebar-container.collapsed {
            width: 40px; /* Width of the toggle button plus some padding */
        }

        .sidebar-container.collapsed .history-title {
            display: none;
        }

        .sidebar-container.collapsed .sidebar-header {
            padding: 15px 0;
            justify-content: center;
        }
        .sidebar-toggle {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 3px;
            cursor: pointer;
            color: var(--text-light);
            font-size: 14px;
            padding: 3px 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            line-height: 1;
            letter-spacing: -1px; /* Tighten up the character spacing */
        }
        .sidebar-toggle:hover {
            color: var(--primary);
            border-color: var(--border);
            background-color: var(--tab-hover);
        }

        /* Collapsed state */
        .sidebar-wrapper.collapsed .sidebar-inner {
            padding: 10px 0;
            width: 40px;
        }

        .sidebar-wrapper.collapsed .history-title,
        .sidebar-wrapper.collapsed .history-list {
            display: none;
        }

        .sidebar-wrapper.collapsed .history-header {
            margin-bottom: 0;
            justify-content: center;
        }
        .sidebar-toggle-icon {
            transition: color 0.2s ease;
        }
        .toolbar {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
        }
        .btn { background: transparent; border: 1px solid var(--border); color: var(--text-light); font-size: 13px; padding: 6px 10px; border-radius: var(--radius); cursor: pointer; transition: var(--transition); }
        .btn:hover { border-color: var(--primary); color: var(--pantone-black); background-color: var(--tab-hover); }
        .btn-primary { background: var(--primary); color: var(--pantone-black); border-color: var(--primary); }
        .btn-primary:hover { color: var(--pantone-black); opacity: 0.9; }
        .auto-save-toggle { display: flex; align-items: center; margin-left: auto; font-size: 13px; color: var(--text-light); }
        .db-controls { display: flex; align-items: center; margin-left: 20px; font-size: 13px; color: var(--text-light); }
        .db-label { margin-right: 8px; }
        .btn-small { font-size: 12px; padding: 4px 8px; margin-left: 4px; }
        .auto-save-toggle input { margin-right: 5px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: var(--border); color: var(--text-light); }

        /* Sidebar toggle button for mobile */
        .toggle-sidebar-btn {
            display: none;
            width: 36px;
            height: 38px;
            background: transparent;
            border: none;
            border-left: 1px solid var(--border);
            color: var(--text-light);
            cursor: pointer;
            font-size: 18px;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .toggle-sidebar-btn:hover {
            color: var(--primary);
            background-color: var(--tab-hover);
        }
        .diff-highlight { background: #f0fff4; color: #16a34a; }
        .status { position: absolute; bottom: 10px; right: 20px; font-size: 13px; color: var(--text-light); opacity: 0; transition: var(--transition); background: var(--surface); padding: 4px 10px; border-radius: 20px; pointer-events: none; }
        .status.visible { opacity: 1; }
        .history-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-light);
            font-weight: 500;
            flex: 1;
        }
        /* Removed history-view-toggle - using only sidebar toggle now */
        .history-list { list-style: none; }
        .history-item { padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; transition: var(--transition); font-size: 14px; display: flex; align-items: flex-start; gap: 10px; }
        .history-item:hover { color: var(--primary); }
        .history-item.selected { color: var(--primary); font-weight: 500; }
        .history-item-content { flex: 1; overflow: hidden; }
        .delete-icon { opacity: 0; cursor: pointer; color: #e74c3c; font-size: 16px; padding: 0 4px; transition: var(--transition); flex-shrink: 0; align-self: center; }
        .history-item:hover .delete-icon { opacity: 1; }
        .preview { white-space: pre-wrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; max-height: 60px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
        .timestamp { font-size: 12px; color: var(--text-light); }

        /* Removed compact history view styling - using only sidebar toggle now */
        /* Responsive design */
        @media (min-width: 1400px) {
            :root {
                --max-width: var(--optimal-width);
            }
            body {
                background: var(--outtee);
            }
            .app {
                margin-top: 20px;
                margin-bottom: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 20px var(--shadow);
                height: calc(100vh - 40px);
            }
        }

        @media (max-width: 1024px) {
            :root {
                --sidebar-width: 220px;
            }
        }

        @media (max-width: 768px) {
            :root {
                --sidebar-width: 180px;
            }
            .toolbar {
                flex-wrap: wrap;
                gap: 6px;
                padding: 10px 15px;
            }
            .db-controls {
                margin-left: 0;
                margin-top: 8px;
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            :root {
                --sidebar-width: 0;
            }
            .sidebar-container {
                position: absolute;
                right: 0;
                top: 0;
                z-index: 10;
                transform: translateX(100%);
                width: 240px;
                height: 100%;
                box-shadow: -2px 0 10px var(--shadow);
            }
            .sidebar-container.open {
                transform: translateX(0);
            }
            .toggle-sidebar-btn {
                display: flex;
            }
            /* Improve mobile spacing */
            .tab {
                min-width: 90px;
                padding: 8px 10px;
            }
            .toolbar {
                padding: 8px 12px;
            }
            .editor-container {
                padding: 15px;
            }
            /* Add backdrop when sidebar is open */
            .sidebar-backdrop {
                display: none;
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.2);
                z-index: 9;
            }
            .sidebar-backdrop.active {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="sidebar-backdrop"></div>
        <div class="main-container">
            <div class="editor-pane">
                <div class="toolbar">
                    <button id="saveBtn" class="btn btn-primary">Save</button>
                    <div class="auto-save-toggle">
                        <input type="checkbox" id="autoSaveToggle" checked>
                        <label for="autoSaveToggle">Make-Sense Autosave</label>
                    </div>
                    <div class="db-controls">
                        <span class="db-label">DB:</span>
                        <button id="exportBtn" class="btn btn-small">Export</button>
                        <button id="importBtn" class="btn btn-small">Import</button>
                        <button id="resetBtn" class="btn btn-small">Reset</button>
                    </div>
                </div>
                <div class="tab-bar">
                    <button id="tabScrollLeft" class="tab-scroll-btn" title="Scroll left">◀</button>
                    <div class="tabs-container">
                        <div id="tabs" class="tabs"></div>
                    </div>
                    <button id="tabScrollRight" class="tab-scroll-btn" title="Scroll right">▶</button>
                    <button id="toggleSidebarBtn" class="toggle-sidebar-btn" title="Toggle History Panel">≡</button>
                    <button id="newTabBtn" class="new-tab-btn" title="New Document">+</button>
                </div>
                <div class="editor-container">
                    <textarea id="editor" placeholder="Start writing..."></textarea>
                    <div id="status" class="status">Saved</div>
                </div>
            </div>
            <div class="sidebar-container">
                <div class="sidebar-header">
                    <div class="history-title">Revision History</div>
                    <button id="sidebarToggle" class="sidebar-toggle" title="Toggle revision history">
                        <span class="sidebar-toggle-icon">⏵║</span>
                    </button>
                </div>
                <div class="sidebar-wrapper">
                    <div class="sidebar">
                        <div class="sidebar-inner">
                            <ul id="historyList" class="history-list"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global debug function that can be called from the console
        function debug(options) {
            const debugInfo = App.enableDebug({
                // Enable tab rename debugging by default
                tabRename: true,
                // Add any user-provided options
                ...(options || {})
            });

            console.log("Debug mode enabled with tab rename diagnostics.");
            console.log("To test tab rename, try one of these methods:");
            console.log("1. Double-click on a tab title");
            console.log("2. Right-click on a tab title (this is often more reliable)");
            console.log("3. Click twice quickly on a tab title");
            console.log("All tab-rename related logs will be prefixed with [TabRename]");
            console.log("---");
            console.log("TIP: If double-clicking isn't working, the right-click method should work reliably");

            return {
                message: "Debug mode enabled with tab rename diagnostics. Check console for logs.",
                debugInfo: debugInfo
            };
        }

        const App = {
            cfg: { DB_NAME: 'editor_db', DB_VER: 1, STORE: 'sqlite_storage', KEY: 'editor_sqlite_db', PAUSE: 2000 },
            state: {
                db: null,
                SQL: null,
                docId: null,
                revId: null,
                saved: '',
                edited: '',
                fingerprint: '',
                autoSave: true,
                openDocs: [],
                activeTabIndex: 0,
                initialized: false,
                debug: false, // Set to true to enable debug logging
                typingMetrics: {
                    lastTypingTime: null,
                    lastContentLength: 0,
                    typingRateHistory: [],
                    avgTypingRate: 0,
                    pauseThreshold: 2000,
                    contentChangeThreshold: 15,
                    sessionStartTime: null
                }
            },
            dom: {},
            timers: { save: null, status: null },

            async init() {
                this.dom = {
                    editor: document.getElementById('editor'),
                    status: document.getElementById('status'),
                    historyList: document.getElementById('historyList'),
                    saveBtn: document.getElementById('saveBtn'),
                    toggleAutoSave: document.getElementById('autoSaveToggle'),
                    tabs: document.getElementById('tabs'),
                    tabScrollLeft: document.getElementById('tabScrollLeft'),
                    tabScrollRight: document.getElementById('tabScrollRight'),
                    tabsContainer: document.querySelector('.tabs-container'),
                    toggleSidebarBtn: document.getElementById('toggleSidebarBtn'),
                    sidebar: document.querySelector('.sidebar-container'),
                    sidebarBackdrop: document.querySelector('.sidebar-backdrop'),
                    sidebarToggle: document.getElementById('sidebarToggle')
                };

                try {
                    this.showStatus('Loading...');
                    this.state.SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/${f}` });
                    await this.initDb();
                    this.bindEvents();
                    this.dom.saveBtn.disabled = this.state.autoSave;

                    // Initialize typing metrics session
                    this.state.typingMetrics.sessionStartTime = Date.now();

                    // Load documents and initialize tabs
                    await this.loadDocuments();

                    if (this.state.openDocs.length === 0) {
                        await this.newDoc();
                    } else {
                        await this.switchToDocument(this.state.openDocs[this.state.activeTabIndex].id);
                    }

                    // Load sidebar state
                    await this.loadSidebarState();

                    // Initialize tab scroll buttons and responsive layout
                    this.checkTabsOverflow();
                    this.checkResponsiveLayout();

                    this.showStatus('Ready');
                } catch (err) {
                    console.error('Init error:', err);
                    this.showStatus('Error: ' + err.message, true);
                }
            },

            bindEvents() {
                this.dom.editor.addEventListener('input', this.handleInput.bind(this));
                this.dom.editor.addEventListener('blur', () => {
                    if (this.state.autoSave && this.dom.editor.value !== this.state.saved) this.save();
                });

                // Add universal event monitoring to diagnose the double-click issue
                const originalAddEventListener = EventTarget.prototype.addEventListener;
                EventTarget.prototype.addEventListener = function(type, listener, options) {
                    // Only monitor dblclick events
                    if (type === 'dblclick') {
                        console.log(`Detected dblclick handler added to:`, this);

                        // Add a wrapper to detect when handlers are called
                        const wrappedListener = function(e) {
                            console.log(`dblclick event running on:`, e.currentTarget);

                            // If this is a tab title, log it specially
                            if (e.target.classList.contains('tab-title')) {
                                console.log(`TAB TITLE EVENT: original listener called for double-click`);
                            }

                            return listener.apply(this, arguments);
                        };

                        return originalAddEventListener.call(this, type, wrappedListener, options);
                    }

                    return originalAddEventListener.call(this, type, listener, options);
                };

                // Explicitly monitor all double-click events at document level
                document.addEventListener('dblclick', e => {
                    console.log(`DIRECT MONITOR: Double-click detected on:`, e.target);
                    console.log(`Double-click phase: ${e.eventPhase}`);
                    console.log(`Double-click target is tab-title: ${e.target.classList.contains('tab-title')}`);

                    // Don't interfere, just log
                }, true);

                // Global event to ensure tab edit inputs get cleaned up when clicking elsewhere in the document
                document.addEventListener('mousedown', e => {
                    const inputs = document.querySelectorAll('.tab-edit-input');
                    if (inputs.length > 0) {
                        let clickedOnInput = false;

                        // Check if click was on any input or within it
                        inputs.forEach(input => {
                            if (input === e.target || input.contains(e.target)) {
                                clickedOnInput = true;
                            }
                        });

                        // If click wasn't on an input, remove all inputs
                        if (!clickedOnInput) {
                            inputs.forEach(input => {
                                // Trigger blur event to save input value
                                input.blur();

                                // Remove with a delay to let blur event finish
                                setTimeout(() => {
                                    if (input.parentNode) {
                                        input.parentNode.removeChild(input);
                                    }
                                }, 10);
                            });
                        }
                    }
                });

                this.dom.saveBtn.addEventListener('click', () => this.save(true));
                document.getElementById('exportBtn').addEventListener('click', this.exportDb.bind(this));
                document.getElementById('importBtn').addEventListener('click', this.importDb.bind(this));
                document.getElementById('resetBtn').addEventListener('click', this.resetDb.bind(this));
                document.getElementById('newTabBtn').addEventListener('click', this.newDoc.bind(this));

                // Tab scroll buttons
                this.dom.tabScrollLeft.addEventListener('click', this.scrollTabsLeft.bind(this));
                this.dom.tabScrollRight.addEventListener('click', this.scrollTabsRight.bind(this));

                // Toggle sidebar on mobile
                this.dom.toggleSidebarBtn.addEventListener('click', this.toggleMobileSidebar.bind(this));

                // Toggle sidebar on desktop with the sidebar toggle button
                this.dom.sidebarToggle.addEventListener('click', this.toggleSidebar.bind(this));

                // Removed history view toggle (using only sidebar toggle now)

                // Check tab overflow and responsive layout on resize
                window.addEventListener('resize', () => {
                    this.checkTabsOverflow();
                    this.checkResponsiveLayout();
                });

                this.dom.toggleAutoSave.addEventListener('change', e => {
                    this.state.autoSave = e.target.checked;
                    this.dom.saveBtn.disabled = this.state.autoSave;
                    this.showStatus(e.target.checked ? 'Autosave enabled' : 'Autosave disabled');
                });

                this.dom.historyList.addEventListener('click', e => {
                    const delIcon = e.target.closest('.delete-icon');
                    if (delIcon) {
                        e.stopPropagation();
                        const item = delIcon.closest('.history-item');
                        if (item) this.deleteRev(parseInt(item.dataset.id));
                        return;
                    }

                    const item = e.target.closest('.history-item');
                    if (item) this.loadRev(parseInt(item.dataset.id));
                });

                // Global document clicks to detect click events that might interfere
                document.addEventListener('click', (e) => {
                    // If in renaming mode, don't process other clicks except on the input itself
                    if (document.body.classList.contains('tab-renaming')) {
                        // Allow clicks on the input field
                        if (e.target.classList.contains('tab-edit-input')) {
                            return;
                        }
                        // Block everything else during rename
                        e.preventDefault();
                        e.stopPropagation();
                        if (this.state.debug) console.log('[TabRename] Blocked click during rename operation');
                        return;
                    }
                }, true); // Use capture phase

                // Tab events with event delegation
                this.dom.tabs.addEventListener('click', e => {
                    // Don't process tab clicks when in rename mode
                    if (document.body.classList.contains('tab-renaming')) {
                        e.preventDefault();
                        e.stopPropagation();
                        return;
                    }

                    // Delete tab button
                    if (e.target.classList.contains('tab-delete')) {
                        e.stopPropagation();
                        const tab = e.target.closest('.tab');
                        if (tab) {
                            const docId = parseInt(tab.dataset.id);
                            this.closeDocument(docId);
                        }
                        return;
                    }

                    // Tab selection
                    const tab = e.target.closest('.tab');
                    if (tab) {
                        const docId = parseInt(tab.dataset.id);
                        this.switchToDocument(docId);
                    }
                });

                // Direct binding to tab-title elements for renaming
                // We'll use a custom function to apply this to each tab-title element
                this.setupTabRenameHandlers = () => {
                    // Find all tab titles
                    const tabTitles = document.querySelectorAll('.tab-title');

                    // Remove any existing handlers first
                    tabTitles.forEach(title => {
                        // Set a data attribute to mark it's properly configured
                        if (!title.hasAttribute('data-rename-handler-setup')) {
                            title.setAttribute('data-rename-handler-setup', 'true');

                            // Add a direct tap-to-edit handler as a simpler alternative to double-click
                            // Store title element reference
                            const titleEl = title;

                            // Add a right-click handler for more reliable editing
                            title.addEventListener('contextmenu', (e) => {
                                if (this.state.debug) console.log('[TabRename] Right-click detected on tab title');
                                e.preventDefault();
                                e.stopPropagation();

                                // Process the rename
                                this.startTabRename(titleEl);

                                return false; // Prevent default context menu
                            });

                            // Also try direct double-click handler (as a backup)
                            title.addEventListener('dblclick', (e) => {
                                if (this.state.debug) console.log('[TabRename] Direct dblclick detected on tab title');
                                e.preventDefault();
                                e.stopPropagation();

                                // Process the rename
                                this.startTabRename(titleEl);
                            }, true); // true means capture phase

                            // And also try mousedown tracking as a third alternative
                            let lastClickTime = 0;
                            title.addEventListener('mousedown', (e) => {
                                // Only process left button clicks
                                if (e.button !== 0) return;

                                const now = Date.now();
                                const timeDiff = now - lastClickTime;

                                if (timeDiff < 500) {
                                    // This is a double-click (two clicks within 500ms)
                                    if (this.state.debug) console.log('[TabRename] Manual double-click detection via mousedown timing');
                                    e.preventDefault();
                                    e.stopPropagation();

                                    // Reset tracking
                                    lastClickTime = 0;

                                    // Process rename
                                    this.startTabRename(titleEl);
                                } else {
                                    // First click - record the time
                                    lastClickTime = now;
                                }
                            });
                        }
                    });

                    if (this.state.debug) {
                        console.log(`[TabRename] Set up rename handlers on ${tabTitles.length} tab titles`);
                    }
                };

                // Actual tab rename function, extracted for reuse
                this.startTabRename = (titleEl) => {
                    if (this.state.debug) {
                        console.log('[TabRename] Starting rename for', titleEl.textContent);
                    }

                    // Get parent tab
                    const tab = titleEl.closest('.tab');
                    if (!tab) {
                        if (this.state.debug) console.log('[TabRename] No tab found for title element');
                        return;
                    }
                    
                    // Check if this is the active tab
                    if (!tab.classList.contains('active')) {
                        if (this.state.debug) console.log('[TabRename] Tab is not active, ignoring rename');
                        return;
                    }

                    // Get document ID
                    const docId = parseInt(tab.dataset.id);
                    if (!docId) {
                        if (this.state.debug) console.log('[TabRename] No valid docId found');
                        return;
                    }

                    // Get current title
                    const docIndex = this.state.openDocs.findIndex(doc => doc.id === docId);
                    if (docIndex === -1) {
                        if (this.state.debug) console.log('[TabRename] Document not found in openDocs');
                        return;
                    }

                    const currentTitle = this.state.openDocs[docIndex].title;

                    // Clean up any existing inputs
                    document.querySelectorAll('.tab-edit-input').forEach(input => {
                        if (input.parentNode) input.parentNode.removeChild(input);
                    });

                    // Create an input for in-place editing
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'tab-edit-input';
                    input.value = currentTitle;
                    input.id = 'tab-edit-input-' + Date.now(); // Unique ID to find it easily
                    
                    // Add attributes to help with focus
                    input.setAttribute('autofocus', 'autofocus');
                    input.setAttribute('tabindex', '1');

                    // Define save function
                    const saveRename = (newTitle) => {
                        if (newTitle && newTitle.trim()) {
                            // Update UI
                            titleEl.textContent = newTitle.trim();

                            // Update database
                            this.state.db.run('UPDATE documents SET title = ? WHERE id = ?', [newTitle.trim(), docId]);
                            this.state.openDocs[docIndex].title = newTitle.trim();

                            // Save changes
                            this.saveToIdb().then(() => this.saveAppState());
                            this.showStatus(`Renamed to "${newTitle.trim()}"`);
                        }
                    };

                    // Key handler with custom focus flag
                    input.customFocused = false; // Track focus state manually
                    let isComposing = false; // Track IME composition state
                    
                    // Draw attention to the input visually to help user with signature color
                    input.style.backgroundColor = 'rgba(255, 179, 0, 0.1)'; // Signature color with low opacity
                    input.style.borderBottom = '2px solid var(--signature-color)';
                    
                    // Track IME composition start
                    input.addEventListener('compositionstart', () => {
                        isComposing = true;
                        if (this.state.debug) console.log('[TabRename] IME composition started');
                    });
                    
                    // Track IME composition end
                    input.addEventListener('compositionend', () => {
                        isComposing = false;
                        if (this.state.debug) console.log('[TabRename] IME composition ended');
                    });
                    
                    input.addEventListener('keydown', (e) => {
                        // Mark as having received focus via keyboard
                        input.customFocused = true;
                        input.style.backgroundColor = 'var(--pantone-white)'; // Change to theme white
                        
                        if (e.key === 'Enter') {
                            // Don't handle Enter during IME composition
                            if (isComposing) {
                                if (this.state.debug) console.log('[TabRename] Ignored Enter during IME composition');
                                return; // Let the IME handle it
                            }
                            
                            e.preventDefault();
                            e.stopPropagation();
                            saveRename(input.value);
                            removeInputSafely();
                        } else if (e.key === 'Escape') {
                            e.preventDefault();
                            e.stopPropagation();
                            removeInputSafely();
                        }
                    });

                    // Blur handler with checks to prevent double removal
                    let inputRemoved = false;
                    
                    const removeInputSafely = () => {
                        if (!inputRemoved && input.parentNode) {
                            input.parentNode.removeChild(input);
                            inputRemoved = true;
                            document.body.classList.remove('tab-renaming');
                        }
                    };
                    
                    input.addEventListener('blur', () => {
                        // First save any changes
                        saveRename(input.value);
                        
                        // Use setTimeout to allow other handlers to complete first
                        setTimeout(removeInputSafely, 0);
                    });

                    // Add to DOM - in-place editing
                    tab.appendChild(input);

                    // Enter renaming mode
                    document.body.classList.add('tab-renaming');
                    
                    // Add a document-level key handler as a fallback
                    let docIsComposing = false; // Track IME composition at document level
                    
                    // Handle composition events at document level
                    document.addEventListener('compositionstart', () => {
                        docIsComposing = true;
                        if (this.state.debug) console.log('[TabRename] Document level IME composition started');
                    });
                    
                    document.addEventListener('compositionend', () => {
                        docIsComposing = false;
                        if (this.state.debug) console.log('[TabRename] Document level IME composition ended');
                    });
                    
                    const documentKeyHandler = function(e) {
                        const renameInput = document.querySelector('.tab-edit-input');
                        
                        // Only handle keys if input exists and hasn't been directly focused
                        if (renameInput && !renameInput.customFocused) {
                            // Don't interfere with IME composition
                            if (docIsComposing && e.key === 'Enter') {
                                if (this.state.debug) console.log('[TabRename] Ignored document Enter during IME composition');
                                return; // Let the IME handle it
                            }
                            
                            // Clear initial value on first keypress (better UX)
                            if (e.key.length === 1 && renameInput.value === currentTitle) {
                                renameInput.value = e.key;
                                if (this.state.debug) console.log('[TabRename] Reset input with new character:', e.key);
                                e.preventDefault();
                                return;
                            }
                            
                            // Type character into input
                            if (e.key.length === 1) {
                                renameInput.value += e.key;
                                if (this.state.debug) console.log('[TabRename] Captured key input from document:', e.key);
                                e.preventDefault();
                            } else if (e.key === 'Enter') {
                                // Submit on Enter
                                const newTitle = renameInput.value.trim();
                                if (newTitle) {
                                    saveRename(newTitle);
                                }
                                removeInputSafely();
                                document.removeEventListener('keypress', documentKeyHandler);
                                document.removeEventListener('keydown', documentKeyHandler);
                                document.removeEventListener('compositionstart', docIsComposing);
                                document.removeEventListener('compositionend', docIsComposing);
                                e.preventDefault();
                            } else if (e.key === 'Escape') {
                                // Cancel on Escape
                                removeInputSafely();
                                document.removeEventListener('keypress', documentKeyHandler);
                                document.removeEventListener('keydown', documentKeyHandler);
                                document.removeEventListener('compositionstart', docIsComposing);
                                document.removeEventListener('compositionend', docIsComposing);
                                e.preventDefault();
                            } else if (e.key === 'Backspace') {
                                // Support backspace
                                if (renameInput.value.length > 0) {
                                    renameInput.value = renameInput.value.slice(0, -1);
                                }
                                e.preventDefault();
                            }
                        }
                    };
                    
                    // Add and remove document key handlers for both keypress and keydown
                    document.addEventListener('keypress', documentKeyHandler);
                    document.addEventListener('keydown', documentKeyHandler);
                    
                    // Clean up document key handlers when input is removed
                    input.addEventListener('blur', function() {
                        document.removeEventListener('keypress', documentKeyHandler);
                        document.removeEventListener('keydown', documentKeyHandler);
                    });

                    // Better focus handling that pauses other UI operations
                    const attemptFocus = () => {
                        try {
                            // Skip if input was removed
                            if (!input.parentNode) return;
                            
                            if (this.state.debug) console.log('[TabRename] Attempting to focus input');
                            
                            // Temporarily stop all click events
                            const stopEvents = (e) => {
                                // Only let through events on our input
                                if (e.target !== input) {
                                    e.preventDefault();
                                    e.stopPropagation();
                                    return false;
                                }
                            };
                            
                            // Add event blockers
                            document.addEventListener('mousedown', stopEvents, true);
                            document.addEventListener('click', stopEvents, true);
                            
                            // Focus without any other UI events interfering
                            input.focus();
                            input.select();
                            
                            // Verify focus
                            const focusSuccess = document.activeElement === input;
                            if (this.state.debug) console.log('[TabRename] Input focused?', focusSuccess);
                            
                            // Remove event blockers after a short delay
                            setTimeout(() => {
                                document.removeEventListener('mousedown', stopEvents, true);
                                document.removeEventListener('click', stopEvents, true);
                            }, 200);
                            
                        } catch (e) {
                            console.error('[TabRename] Focus error:', e);
                        }
                    };

                    // Multiple focus attempts with increasing delays
                    setTimeout(attemptFocus, 10);
                    setTimeout(attemptFocus, 50);
                    setTimeout(attemptFocus, 150);
                    setTimeout(attemptFocus, 300);
                };

                // Set up handlers on initial tabs
                this.setupTabRenameHandlers();

                // Update the setupTabRenameHandlers to run after tab updates
                const originalUpdateTabs = this.updateTabs;
                this.updateTabs = function() {
                    originalUpdateTabs.apply(this, arguments);
                    setTimeout(() => {
                        this.setupTabRenameHandlers();
                    }, 10);
                };
            },

            handleInput() {
                const now = Date.now();
                const content = this.dom.editor.value;
                const metrics = this.state.typingMetrics;

                // Update typing metrics
                if (metrics.lastTypingTime) {
                    const timeDelta = now - metrics.lastTypingTime;
                    const contentDelta = Math.abs(content.length - metrics.lastContentLength);

                    if (timeDelta > 0 && timeDelta < 5000 && contentDelta > 0) { // Ignore very long pauses
                        // Calculate characters per minute
                        const rate = (contentDelta / timeDelta) * 60000;

                        // Update history (keep last 10 samples)
                        metrics.typingRateHistory.push(rate);
                        if (metrics.typingRateHistory.length > 10) {
                            metrics.typingRateHistory.shift();
                        }

                        // Calculate average typing rate
                        const sum = metrics.typingRateHistory.reduce((a, b) => a + b, 0);
                        metrics.avgTypingRate = sum / metrics.typingRateHistory.length;

                        // Adjust thresholds based on typing patterns
                        this.adjustSaveThresholds();
                    }
                }

                // Update metrics state
                metrics.lastTypingTime = now;
                metrics.lastContentLength = content.length;
                this.state.edited = content;

                // Handle saving logic
                if (this.timers.save) clearTimeout(this.timers.save);

                if (this.state.autoSave && this.state.edited !== this.state.saved) {
                    this.timers.save = setTimeout(() => {
                        const newHash = this.getHash(this.dom.editor.value);

                        // Check for different types of meaningful changes
                        const contentChanged = this.dom.editor.value !== this.state.saved;
                        const hashChanged = newHash !== this.state.fingerprint;
                        const changeSize = Math.abs(this.dom.editor.value.length - this.state.saved.length);
                        const isDeletion = this.dom.editor.value.length < this.state.saved.length;
                        const lastSavedParaCount = this.state.saved.split('\n').length;
                        const currentParaCount = this.dom.editor.value.split('\n').length;
                        const isParaBreak = currentParaCount > lastSavedParaCount;

                        // Significant time has passed without a save (5 minutes)
                        const longSessionWithoutSave = (now - metrics.sessionStartTime) > 300000 &&
                                                     contentChanged;

                        // Check if should save based on combined factors
                        if (hashChanged && contentChanged && (
                            changeSize > metrics.contentChangeThreshold ||
                            isDeletion ||
                            isParaBreak ||
                            longSessionWithoutSave
                        )) {
                            this.save();
                            // Update session start time after save
                            metrics.sessionStartTime = now;
                        }
                    }, metrics.pauseThreshold);
                }
            },

            // Adjust save thresholds based on typing patterns and document length
            adjustSaveThresholds() {
                const metrics = this.state.typingMetrics;
                const rate = metrics.avgTypingRate;
                const docLength = this.dom.editor.value.length;

                // Store previous values for debug logging
                const oldPauseThreshold = metrics.pauseThreshold;
                const oldContentThreshold = metrics.contentChangeThreshold;

                // Typing speed adjustments
                if (rate > 200) {
                    // Fast typing: longer pause, higher threshold
                    metrics.pauseThreshold = 3000;
                } else if (rate < 60) {
                    // Slow typing: shorter pause, lower threshold
                    metrics.pauseThreshold = 1500;
                } else {
                    // Normal typing
                    metrics.pauseThreshold = 2000;
                }

                // Document length adjustments
                if (docLength > 10000) {
                    // Longer document: higher threshold
                    metrics.contentChangeThreshold = Math.min(30, Math.floor(docLength * 0.001));
                } else if (docLength < 1000) {
                    // Short document: lower threshold
                    metrics.contentChangeThreshold = 10;
                } else {
                    // Medium document
                    metrics.contentChangeThreshold = 15;
                }

                // Debug logging when values change
                if (this.state.debug &&
                    (oldPauseThreshold !== metrics.pauseThreshold ||
                     oldContentThreshold !== metrics.contentChangeThreshold)) {
                    console.log(`[Adaptive] Thresholds adjusted:`);
                    console.log(`- Typing speed: ${Math.round(rate)} chars/min (${rate > 200 ? 'fast' : rate < 60 ? 'slow' : 'normal'})`);
                    console.log(`- Document length: ${docLength} chars (${docLength > 10000 ? 'long' : docLength < 1000 ? 'short' : 'medium'})`);
                    console.log(`- Pause threshold: ${oldPauseThreshold}ms → ${metrics.pauseThreshold}ms`);
                    console.log(`- Content threshold: ${oldContentThreshold} → ${metrics.contentChangeThreshold} chars`);
                }
            },

            getHash(text) {
                let hash = 0;
                if (!text.length) return hash;

                for (let i = 0; i < text.length; i++) {
                    hash = ((hash << 5) - hash) + text.charCodeAt(i);
                    hash = hash & hash;
                }
                return hash.toString();
            },

            findDiff(oldText, newText) {
                let i = 0;
                const minLen = Math.min(oldText.length, newText.length);

                while (i < minLen && oldText[i] === newText[i]) i++;

                let start = Math.max(0, i - 20);
                let end = Math.min(newText.length, i + 100);

                if (start > 0) {
                    while (start > 0 && !/\s/.test(newText[start])) start--;
                    if (start > 0) start++;
                }

                if (end < newText.length) {
                    while (end < newText.length && !/\s/.test(newText[end])) end++;
                }

                return newText.substring(start, end).replace(/\n/g, '↵\n');
            },

            async initDb() {
                try {
                    const idb = await this.openIdb();
                    const tx = idb.transaction([this.cfg.STORE], 'readonly');
                    const store = tx.objectStore(this.cfg.STORE);
                    const dbData = await this.getFromStore(store, this.cfg.KEY);

                    if (dbData) {
                        this.state.db = new this.state.SQL.Database(new Uint8Array(dbData));
                    } else {
                        this.state.db = new this.state.SQL.Database();
                        this.state.db.run(`
                            CREATE TABLE IF NOT EXISTS documents (
                                id INTEGER PRIMARY KEY AUTOINCREMENT,
                                title TEXT DEFAULT 'Untitled',
                                created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
                            )
                        `);
                        this.state.db.run(`
                            CREATE TABLE IF NOT EXISTS revisions (
                                id INTEGER PRIMARY KEY AUTOINCREMENT,
                                document_id INTEGER,
                                content TEXT,
                                timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                                FOREIGN KEY (document_id) REFERENCES documents (id)
                            )
                        `);
                        this.state.db.run(`
                            CREATE TABLE IF NOT EXISTS app_state (
                                key TEXT PRIMARY KEY,
                                value TEXT
                            )
                        `);
                        await this.saveToIdb();
                    }
                } catch (err) {
                    console.error('DB init error:', err);
                    throw err;
                }
            },

            openIdb() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(this.cfg.DB_NAME, this.cfg.DB_VER);
                    req.onupgradeneeded = e => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(this.cfg.STORE)) {
                            db.createObjectStore(this.cfg.STORE, { keyPath: 'key' });
                        }
                    };
                    req.onsuccess = e => resolve(e.target.result);
                    req.onerror = e => reject(new Error('IndexedDB error: ' + e.target.error));
                });
            },

            getFromStore(store, key) {
                return new Promise((resolve, reject) => {
                    const req = store.get(key);
                    req.onsuccess = () => resolve(req.result ? req.result.data : null);
                    req.onerror = e => reject(new Error('Store get error: ' + e.target.error));
                });
            },

            putInStore(store, key, data) {
                return new Promise((resolve, reject) => {
                    const req = store.put({ key, data });
                    req.onsuccess = () => resolve();
                    req.onerror = e => reject(new Error('Store put error: ' + e.target.error));
                });
            },

            async saveToIdb() {
                if (!this.state.db) return;

                try {
                    const data = this.state.db.export();
                    const idb = await this.openIdb();
                    const tx = idb.transaction([this.cfg.STORE], 'readwrite');
                    const store = tx.objectStore(this.cfg.STORE);

                    await this.putInStore(store, this.cfg.KEY, data);

                    return new Promise((resolve, reject) => {
                        tx.oncomplete = () => resolve();
                        tx.onerror = e => reject(new Error('Transaction error: ' + e.target.error));
                    });
                } catch (err) {
                    console.error('Save to IDB error:', err);
                    throw err;
                }
            },

            // Save current content as a new revision
            async save(manual = false) {
                if (!this.state.docId) return;

                const content = this.dom.editor.value;
                this.state.fingerprint = this.getHash(content);

                if (content === this.state.saved) {
                    if (manual) this.showStatus('No changes to save');
                    return;
                }

                try {
                    const stmt = this.state.db.prepare(
                        'INSERT INTO revisions (document_id, content, timestamp) VALUES (?, ?, datetime("now"))'
                    );
                    stmt.run([this.state.docId, content]);
                    stmt.free();

                    this.state.saved = content;

                    // Reset typing session metrics after save
                    this.state.typingMetrics.sessionStartTime = Date.now();

                    // Update last edited timestamp in open docs
                    const docIndex = this.state.openDocs.findIndex(doc => doc.id === this.state.docId);
                    if (docIndex !== -1) {
                        this.state.openDocs[docIndex].lastEdited = new Date().toISOString();
                    }

                    await this.saveToIdb();
                    await this.saveAppState();
                    await this.loadRevHistory();

                    this.showStatus(manual ? 'Saved' : 'Auto-saved');
                } catch (err) {
                    console.error('Save error:', err);
                    this.showStatus('Error: ' + err.message, true);
                }
            },

            async loadRev(revId) {
                try {
                    if (this.state.autoSave && this.dom.editor.value !== this.state.saved) {
                        await this.save();
                    }

                    const results = this.state.db.exec('SELECT content FROM revisions WHERE id = ?', [revId]);

                    if (results.length > 0 && results[0].values.length > 0) {
                        const content = results[0].values[0][0];
                        this.dom.editor.value = content;
                        this.state.saved = content;
                        this.state.fingerprint = this.getHash(content);
                        this.state.revId = revId;

                        document.querySelectorAll('.history-item').forEach(item => {
                            item.classList.toggle('selected', parseInt(item.dataset.id) === revId);
                        });

                        this.showStatus('Revision loaded');
                    }
                } catch (err) {
                    console.error('Load revision error:', err);
                    this.showStatus('Error: ' + err.message, true);
                }
            },

            async loadRevHistory() {
                if (!this.state.docId) return;

                try {
                    const query = `
                        SELECT r1.id, substr(r1.content, 1, 150) || CASE WHEN length(r1.content) > 150 THEN '...' ELSE '' END AS preview,
                        r1.timestamp, r2.content as prev_content, r1.content as curr_content
                        FROM revisions r1
                        LEFT JOIN revisions r2 ON r2.id = (
                            SELECT id FROM revisions WHERE document_id = r1.document_id AND id < r1.id ORDER BY id DESC LIMIT 1
                        )
                        WHERE r1.document_id = ? ORDER BY r1.timestamp DESC
                    `;

                    const results = this.state.db.exec(query, [this.state.docId]);
                    this.dom.historyList.innerHTML = '';

                    if (results.length > 0 && results[0].values.length > 0) {
                        // Check if we're in compact mode
                        const isCompactMode = this.dom.historyList.classList.contains('history-compact');

                        // Create HTML for each history item
                        this.dom.historyList.innerHTML = results[0].values.map(row => {
                            const id = row[0];
                            const preview = row[1] || '(Empty)';
                            const timestamp = row[2];
                            const prevContent = row[3] || '';
                            const currContent = row[4] || '';

                            let previewContent, previewHtml;

                            if (prevContent && prevContent !== currContent) {
                                const diffText = this.findDiff(prevContent, currContent);
                                previewHtml = `<span class="diff-highlight">${diffText || preview}</span>`;
                                previewContent = diffText || preview;
                            } else {
                                previewHtml = preview;
                                previewContent = preview;
                            }

                            // Apply different structure for compact mode
                            if (isCompactMode) {
                                return `
                                    <li class="history-item ${id === this.state.revId ? 'selected' : ''}" data-id="${id}" style="padding:4px 0; font-size:12px; align-items:center;">
                                        <div class="history-item-content" style="display:flex; flex-direction:row; align-items:center; gap:6px;">
                                            <div class="preview" style="margin-bottom:0; max-height:18px; font-size:12px; line-height:1.3; -webkit-line-clamp:1;">${previewHtml}</div>
                                            <div class="timestamp" style="font-size:10px;">${this.formatDate(timestamp)}</div>
                                        </div>
                                        <span class="delete-icon" style="font-size:12px; padding:2px; height:12px; width:12px;" title="Delete revision">×</span>
                                    </li>
                                `;
                            } else {
                                return `
                                    <li class="history-item ${id === this.state.revId ? 'selected' : ''}" data-id="${id}">
                                        <div class="history-item-content">
                                            <div class="preview">${previewHtml}</div>
                                            <div class="timestamp">${this.formatDate(timestamp)}</div>
                                        </div>
                                        <span class="delete-icon" title="Delete revision">×</span>
                                    </li>
                                `;
                            }
                        }).join('');
                    } else {
                        // Only show "No revisions yet" if sidebar is not collapsed
                        const sidebarCollapsed = this.dom.sidebar.classList.contains('collapsed');
                        if (this.state.debug) {
                            console.log(`[loadRevHistory] Sidebar collapsed state: ${sidebarCollapsed}`);
                        }
                        
                        if (!sidebarCollapsed) {
                            this.dom.historyList.innerHTML = '<li class="history-item">No revisions yet</li>';
                        } else {
                            // Clear the history list when collapsed to prevent showing "No revisions yet"
                            this.dom.historyList.innerHTML = '';
                        }
                    }
                } catch (err) {
                    console.error('Load history error:', err);
                    this.showStatus('Error: ' + err.message, true);
                }
            },

            async deleteRev(revId) {
                if (!revId) return;

                try {
                    const countResult = this.state.db.exec(
                        'SELECT COUNT(*) FROM revisions WHERE document_id = ?',
                        [this.state.docId]
                    );
                    const revCount = countResult[0].values[0][0];

                    if (revCount <= 1) {
                        this.showStatus("Can't delete the only revision", true);
                        return;
                    }

                    const needNewRev = revId === this.state.revId;
                    this.state.db.run('DELETE FROM revisions WHERE id = ?', [revId]);

                    if (needNewRev) {
                        const latestResult = this.state.db.exec(
                            'SELECT id, content FROM revisions WHERE document_id = ? ORDER BY timestamp DESC LIMIT 1',
                            [this.state.docId]
                        );

                        if (latestResult.length > 0 && latestResult[0].values.length > 0) {
                            const latestId = latestResult[0].values[0][0];
                            const latestContent = latestResult[0].values[0][1];

                            this.dom.editor.value = latestContent;
                            this.state.saved = latestContent;
                            this.state.fingerprint = this.getHash(latestContent);
                            this.state.revId = latestId;
                        }
                    }

                    await this.saveToIdb();
                    await this.loadRevHistory();

                    this.showStatus('Revision deleted');
                } catch (err) {
                    console.error('Delete revision error:', err);
                    this.showStatus('Error: ' + err.message, true);
                }
            },

            async newDoc() {
                try {
                    // Save current document if needed
                    if (this.state.docId && this.state.autoSave && this.dom.editor.value !== this.state.saved) {
                        await this.save();
                    }

                    // Create new document in database
                    const docTitle = 'Untitled Document';
                    this.state.db.run('INSERT INTO documents (title) VALUES (?)', [docTitle]);
                    const result = this.state.db.exec('SELECT last_insert_rowid()');
                    const newDocId = result[0].values[0][0];

                    // Clear editor
                    this.dom.editor.value = '';
                    this.state.saved = '';
                    this.state.fingerprint = this.getHash('');
                    this.state.revId = null;

                    // Add to open documents and set as active
                    this.state.openDocs.push({
                        id: newDocId,
                        title: docTitle,
                        lastEdited: new Date().toISOString()
                    });

                    this.state.docId = newDocId;
                    this.state.activeTabIndex = this.state.openDocs.length - 1;

                    // Save state and update tabs
                    await this.saveAppState();
                    await this.saveToIdb();
                    this.updateTabs();

                    // Force scroll to the newly created tab after the DOM has been updated
                    setTimeout(() => {
                        // Ensure proper layout is maintained
                        this.checkTabsOverflow();

                        // Force scroll to the end of the tab list to show the new tab
                        const tabsElement = this.dom.tabs;
                        if (tabsElement) {
                            // Calculate exactly how far to scroll to show the new tab
                            const lastTab = tabsElement.querySelector('.tab:last-child');
                            if (lastTab) {
                                // Find the right edge of the last tab
                                const lastTabRight = lastTab.offsetLeft + lastTab.offsetWidth;
                                // Calculate how far to scroll to make it visible
                                const containerWidth = this.dom.tabsContainer.clientWidth;
                                const scrollPosition = lastTabRight - containerWidth + 10; // 10px buffer

                                // Set scroll position
                                tabsElement.scrollLeft = Math.max(0, scrollPosition);
                            } else {
                                // Fallback to scrolling to the end
                                tabsElement.scrollLeft = tabsElement.scrollWidth;
                            }

                            this.updateScrollButtonStates();
                        }
                    }, 50);

                    await this.loadRevHistory();

                    this.showStatus('New document created');
                    this.dom.editor.focus();
                } catch (err) {
                    console.error('New doc error:', err);
                    this.showStatus('Error: ' + err.message, true);
                }
            },

            // Load all documents for tabs
            async loadDocuments() {
                try {
                    // Try to load app state (open docs, active tab)
                    await this.loadAppState();

                    // If no open docs stored, get recent documents
                    if (!this.state.openDocs || this.state.openDocs.length === 0) {
                        const docResults = this.state.db.exec(`
                            SELECT id, title, created_at
                            FROM documents
                            ORDER BY created_at DESC
                            LIMIT 5
                        `);

                        if (docResults.length > 0 && docResults[0].values.length > 0) {
                            this.state.openDocs = docResults[0].values.map(row => ({
                                id: row[0],
                                title: row[1],
                                lastEdited: row[2]
                            }));
                            this.state.activeTabIndex = 0;
                        }
                    }

                    // Update the tabs UI
                    this.updateTabs();

                    return this.state.openDocs.length > 0;
                } catch (err) {
                    console.error('Load documents error:', err);
                    return false;
                }
            },

            // Update the tabs UI
            updateTabs() {
                if (!this.dom.tabs) return;

                const tabsHtml = this.state.openDocs.map((doc, index) => {
                    const isActive = index === this.state.activeTabIndex;
                    return `
                        <div class="tab ${isActive ? 'active' : ''}" data-id="${doc.id}">
                            <span class="tab-title" title="Double-click to rename '${this.escapeHtml(doc.title)}'">${this.escapeHtml(doc.title)}</span>
                            <span class="tab-delete" title="Close document">×</span>
                        </div>
                    `;
                }).join('');

                this.dom.tabs.innerHTML = tabsHtml;

                // Check tab overflow state after DOM has been updated
                setTimeout(() => {
                    this.checkTabsOverflow();
                    // If we have multiple tabs, make sure to check if scroll buttons are needed
                    if (this.state.openDocs.length > 1) {
                        this.updateScrollButtonStates();
                        // Ensure scroll to active tab happens after overflow check
                        this.scrollToActiveTab();
                    }
                }, 10);

                // Scroll to active tab
                this.scrollToActiveTab();
            },

            // Check if tabs are overflowing and update scroll button states
            checkTabsOverflow() {
                if (!this.dom.tabs || !this.dom.tabsContainer) return;

                // Calculate tab widths and container width with high precision
                const tabsWidth = Math.ceil(this.dom.tabs.scrollWidth);
                const containerWidth = Math.floor(this.dom.tabsContainer.clientWidth);

                // Determine if tabs are overflowing with a 1px buffer for rounding errors
                const hasOverflow = tabsWidth > containerWidth + 1;

                // Update scroll button states
                this.updateScrollButtonStates();

                // Toggle visibility of scroll buttons based on overflow
                this.dom.tabScrollLeft.style.display = hasOverflow ? 'flex' : 'none';
                this.dom.tabScrollRight.style.display = hasOverflow ? 'flex' : 'none';

                // Add some debugging to help understand the issue
                if (this.state.debug) {
                    console.log(`Tab overflow check: ${tabsWidth}px > ${containerWidth}px = ${hasOverflow}`);
                }

                return hasOverflow;
            },

            // Update the enabled/disabled state of scroll buttons
            updateScrollButtonStates() {
                if (!this.dom.tabs || !this.dom.tabsContainer) return;

                const tabsElement = this.dom.tabs;
                const atStart = tabsElement.scrollLeft <= 0;
                const atEnd = tabsElement.scrollLeft + this.dom.tabsContainer.clientWidth >= tabsElement.scrollWidth - 1;

                // Update button states
                this.dom.tabScrollLeft.classList.toggle('disabled', atStart);
                this.dom.tabScrollRight.classList.toggle('disabled', atEnd);
            },

            // Scroll tabs left
            scrollTabsLeft() {
                if (!this.dom.tabs || this.dom.tabScrollLeft.classList.contains('disabled')) return;

                const scrollAmount = this.dom.tabsContainer.clientWidth * 0.8;
                this.dom.tabs.scrollLeft -= scrollAmount;

                // Update button states after scrolling
                setTimeout(() => this.updateScrollButtonStates(), 300);
            },

            // Scroll tabs right
            scrollTabsRight() {
                if (!this.dom.tabs || this.dom.tabScrollRight.classList.contains('disabled')) return;

                const scrollAmount = this.dom.tabsContainer.clientWidth * 0.8;
                this.dom.tabs.scrollLeft += scrollAmount;
