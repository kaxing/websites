                // Update button states after scrolling
                setTimeout(() => this.updateScrollButtonStates(), 300);
            },

            // Scroll to make active tab visible
            scrollToActiveTab() {
                if (!this.dom.tabs || !this.dom.tabsContainer) return;

                const activeTab = this.dom.tabs.querySelector('.tab.active');
                if (!activeTab) return;

                // Get positions with high precision
                const tabLeft = activeTab.offsetLeft;
                const tabWidth = activeTab.offsetWidth;
                const tabRight = tabLeft + tabWidth;
                const containerLeft = this.dom.tabs.scrollLeft;
                const containerWidth = this.dom.tabsContainer.clientWidth;
                const containerRight = containerLeft + containerWidth;

                // Add buffer for visibility check
                const buffer = 2; // 2px buffer for rounding errors

                // Debug logging
                if (this.state.debug) {
                    console.log(`Active tab: left=${tabLeft}, right=${tabRight}, width=${tabWidth}`);
                    console.log(`Container: left=${containerLeft}, right=${containerRight}, width=${containerWidth}`);
                    console.log(`Visibility: left visible=${tabLeft >= containerLeft-buffer}, right visible=${tabRight <= containerRight+buffer}`);
                }

                // Scroll if active tab is not fully visible
                if (tabLeft < containerLeft + buffer) {
                    // Tab is off to the left
                    this.dom.tabs.scrollLeft = Math.max(0, tabLeft - 10); // 10px padding
                    if (this.state.debug) console.log(`Scrolling left to ${this.dom.tabs.scrollLeft}`);
                } else if (tabRight > containerRight - buffer) {
                    // Tab is off to the right
                    this.dom.tabs.scrollLeft = tabRight - containerWidth + 10; // 10px padding
                    if (this.state.debug) console.log(`Scrolling right to ${this.dom.tabs.scrollLeft}`);
                }

                // Update button states
                this.updateScrollButtonStates();
            },

            // Toggle sidebar visibility on mobile
            toggleMobileSidebar() {
                if (!this.dom.sidebar) return;

                // Toggle sidebar open state
                const isOpen = this.dom.sidebar.classList.toggle('open');

                // Also update toggle icon for mobile
                const toggleIcon = this.dom.sidebarToggle?.querySelector('.sidebar-toggle-icon');
                if (toggleIcon) {
                    toggleIcon.textContent = '⏵║'; // Always use the collapse icon when sidebar is shown on mobile
                    this.dom.sidebarToggle.title = "Collapse revision history";
                }

                if (this.state.debug) {
                    console.log(`Mobile sidebar toggled: ${isOpen ? 'open' : 'closed'}`);
                }

                // Toggle backdrop
                if (this.dom.sidebarBackdrop) {
                    this.dom.sidebarBackdrop.classList.toggle('active', isOpen);

                    // Add click event to close sidebar when backdrop is clicked
                    if (isOpen) {
                        const handleBackdropClick = () => {
                            this.toggleMobileSidebar();
                            this.dom.sidebarBackdrop.removeEventListener('click', handleBackdropClick);
                        };
                        this.dom.sidebarBackdrop.addEventListener('click', handleBackdropClick);
                    }
                }
            },

            // Toggle desktop sidebar collapsed state
            async toggleSidebar() {
                if (!this.dom.sidebar) return;

                // Toggle collapsed class
                const isCollapsed = this.dom.sidebar.classList.toggle('collapsed');

                // Update the icon and button text based on collapsed state
                const toggleIcon = this.dom.sidebarToggle.querySelector('.sidebar-toggle-icon');

                    toggleIcon.textContent = isCollapsed ? '⏴║' : '⏵║';

                // Notify for debug

                // Save sidebar state preference to SQLite

                        this.state.db.run('UPDATE app_state SET value = ? WHERE key = "sidebar_state"', [isCollapsed ? 'collapsed' : 'expanded']);
                    } else {
                        this.state.db.run('INSERT INTO app_state (key, value) VALUES (?, ?)', ['sidebar_state', isCollapsed ? 'collapsed' : 'expanded']);

                    if (this.state.debug) {
                        console.log(`Sidebar state saved to database: ${isCollapsed ? 'collapsed' : 'expanded'}`);
                    }
                } catch (err) {
                    console.error('Save sidebar state error:', err);
                }
                
                // Refresh the revision history list to ensure "No revisions yet" message is properly updated
                // This will clear the message when collapsed and show it when expanded
                await this.loadRevHistory();

                // Slight delay before triggering window resize event to properly adjust layout
                setTimeout(() => {

                    }

            },

            // Check responsive layout needs
            checkResponsiveLayout() {
                if (!this.dom.sidebar) return;

                const isMobile = window.innerWidth <= 480;

                // Mobile sidebar toggle button
                if (this.dom.toggleSidebarBtn) {
                    // Show/hide mobile sidebar toggle based on screen size
                    this.dom.toggleSidebarBtn.style.display = isMobile ? 'flex' : 'none';
                }

                // Desktop sidebar toggle
                if (this.dom.sidebarToggle) {
                    // Only show the sidebar toggle in desktop mode
                    this.dom.sidebarToggle.style.display = isMobile ? 'none' : 'flex';
                }

                // Reset mobile sidebar state when switching to desktop
                if (!isMobile) {
                    if (this.dom.sidebar.classList.contains('open')) {
                        this.dom.sidebar.classList.remove('open');
                    }

                    // Also hide backdrop
                    if (this.dom.sidebarBackdrop && this.dom.sidebarBackdrop.classList.contains('active')) {
                        this.dom.sidebarBackdrop.classList.remove('active');
                    }

                    // Restore saved sidebar collapsed state in desktop mode
                    // This is done once during initialization in the loadSidebarState method
                }
            },

            // Load sidebar and history view states from SQLite database
            async loadSidebarState() {
                if (!this.dom.sidebar || !this.dom.sidebarToggle) return;

                try {
                    // Load sidebar collapse state
                    const sidebarResults = this.state.db.exec('SELECT value FROM app_state WHERE key = "sidebar_state"');

                    if (sidebarResults.length > 0 && sidebarResults[0].values.length > 0) {
                        const savedState = sidebarResults[0].values[0][0];
                        const shouldBeCollapsed = savedState === 'collapsed';

                        this.dom.sidebar.classList.toggle('collapsed', shouldBeCollapsed);

                        // Update the icon to match the state
                        const toggleIcon = this.dom.sidebarToggle.querySelector('.sidebar-toggle-icon');

                        }

                        // Update the button title based on state

                        // Log for debugging
                        if (this.state.debug) {
                            console.log(`Loaded sidebar state from database: ${savedState}`);
                            setTimeout(() => {
                                console.log(`Sidebar width after state load: ${this.dom.sidebar.offsetWidth}px`);
                                const toggleRect = this.dom.sidebarToggle.getBoundingClientRect();
                                console.log(`Toggle position after state load: left=${toggleRect.left}px`);
                            }, 100);
                        }
                    }

                    // Removed history view state loading - using only sidebar toggle now
                    
                    // Refresh the revision history to ensure proper display based on sidebar state
                    // This will ensure "No revisions yet" message is properly hidden when sidebar is collapsed
                    await this.loadRevHistory();
                } catch (err) {
                    console.error('Load sidebar/history state error:', err);
                }
            },

            // Removed toggleHistoryView method - using only sidebar toggle now

            // Helper to escape HTML in tab titles
            escapeHtml(text) {
                const element = document.createElement('div');
                element.textContent = text;
                return element.innerHTML;
            },

            // Switch to a document
            async switchToDocument(docId) {
                try {
                    // Save current document if needed
                    if (this.state.docId && this.state.autoSave && this.dom.editor.value !== this.state.saved) {
                        await this.save();
                    }

                    // Find document index
                    const docIndex = this.state.openDocs.findIndex(doc => doc.id === docId);
                    if (docIndex === -1) return false;

                    // Get document content
                    const revResults = this.state.db.exec(`
                        SELECT r.id, r.content, d.title
                        FROM revisions r
                        JOIN documents d ON r.document_id = d.id
                        WHERE r.document_id = ?
                        ORDER BY r.timestamp DESC
                        LIMIT 1
                    `, [docId]);

                    let content = '';
                    let revId = null;
                    let title = this.state.openDocs[docIndex].title;

                    if (revResults.length > 0 && revResults[0].values.length > 0) {
                        revId = revResults[0].values[0][0];
                        content = revResults[0].values[0][1];
                        // Update title if it's changed
                        title = revResults[0].values[0][2];
                        this.state.openDocs[docIndex].title = title;
                    }

                    // Update state and UI
                    this.state.docId = docId;
                    this.state.revId = revId;
                    this.state.activeTabIndex = docIndex;
                    this.dom.editor.value = content;
                    this.state.saved = content;
                    this.state.fingerprint = this.getHash(content);

                    // Update tabs and revision history
                    this.updateTabs();

                    // Make sure the active tab is visible after switching
                    setTimeout(() => {
                        // Check for overflow
                        this.checkTabsOverflow();
                        // Explicitly scroll to make active tab visible
                        this.scrollToActiveTab();
                    }, 50);

                    await this.loadRevHistory();
                    await this.saveAppState();

                    return true;
                } catch (err) {
                    console.error('Switch document error:', err);
                    this.showStatus('Error switching document: ' + err.message, true);
                    return false;
                }
            },

            // Close a document tab
            async closeDocument(docId) {
                if (!confirm('Close this document? Any saved content will remain in the database.')) {
                    return;
                }

                try {
                    // Save if needed
                    if (this.state.docId === docId && this.state.autoSave && this.dom.editor.value !== this.state.saved) {
                        await this.save();
                    }

                    // Find document index
                    const docIndex = this.state.openDocs.findIndex(doc => doc.id === docId);
                    if (docIndex === -1) return;

                    // Remove from open documents
                    this.state.openDocs.splice(docIndex, 1);

                    // If no documents left, create a new one
                    if (this.state.openDocs.length === 0) {
                        await this.newDoc();
                        return;
                    }

                    // Adjust active tab index if needed
                    if (docIndex <= this.state.activeTabIndex) {
                        this.state.activeTabIndex = Math.max(0, this.state.activeTabIndex - 1);
                    }

                    // Switch to the active document
                    const activeDoc = this.state.openDocs[this.state.activeTabIndex];
                    await this.switchToDocument(activeDoc.id);

                    // Save app state
                    await this.saveAppState();
                } catch (err) {
                    console.error('Close document error:', err);
                    this.showStatus('Error closing document: ' + err.message, true);
                }
            },

            // Tab renaming is now handled directly in the dblclick event listener
            // No separate methods needed

            // Save app state (open documents, active tab)
            async saveAppState() {
                try {
                    const state = JSON.stringify({
                        openDocs: this.state.openDocs,
                        activeTabIndex: this.state.activeTabIndex
                    });

                    // Check if we have an existing state
                    const existingState = this.state.db.exec('SELECT value FROM app_state WHERE key = "tabs"');

                    if (existingState.length > 0 && existingState[0].values.length > 0) {
                        this.state.db.run('UPDATE app_state SET value = ? WHERE key = "tabs"', [state]);
                    } else {
                        this.state.db.run('INSERT INTO app_state (key, value) VALUES (?, ?)', ['tabs', state]);
                    }

                    await this.saveToIdb();
                } catch (err) {
                    console.error('Save app state error:', err);
                }
            },

            // Load app state
            async loadAppState() {
                try {
                    const stateResults = this.state.db.exec('SELECT value FROM app_state WHERE key = "tabs"');

                    if (stateResults.length > 0 && stateResults[0].values.length > 0) {
                        const state = JSON.parse(stateResults[0].values[0][0]);
                        this.state.openDocs = state.openDocs || [];
                        this.state.activeTabIndex = state.activeTabIndex || 0;
                    } else {
                        this.state.openDocs = [];
                        this.state.activeTabIndex = 0;
                    }
                } catch (err) {
                    console.error('Load app state error:', err);
                    this.state.openDocs = [];
                    this.state.activeTabIndex = 0;
                }
            },

            async loadLatestDoc() {
                try {
                    const docResults = this.state.db.exec('SELECT id FROM documents ORDER BY created_at DESC LIMIT 1');

                    if (docResults.length === 0 || docResults[0].values.length === 0) {
                        return false;
                    }

                    this.state.docId = docResults[0].values[0][0];

                    const revResults = this.state.db.exec(
                        'SELECT id, content FROM revisions WHERE document_id = ? ORDER BY timestamp DESC LIMIT 1',
                        [this.state.docId]
                    );

                    if (revResults.length > 0 && revResults[0].values.length > 0) {
                        const id = revResults[0].values[0][0];
                        const content = revResults[0].values[0][1];

                        this.dom.editor.value = content;
                        this.state.saved = content;
                        this.state.fingerprint = this.getHash(content);
                        this.state.revId = id;

                        await this.loadRevHistory();
                        return true;
                    }

                    return false;
                } catch (err) {
                    console.error('Load doc error:', err);
                    return false;
                }
            },

            exportDb() {
                if (!this.state.db) return;

                try {
                    const data = this.state.db.export();
                    const blob = new Blob([data], { type: 'application/x-sqlite3' });
                    const url = URL.createObjectURL(blob);

                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'editor_database.sqlite';
                    a.style.display = 'none';
                    document.body.appendChild(a);
                    a.click();

                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 100);

                    this.showStatus('Database exported');
                } catch (err) {
                    console.error('Export error:', err);
                    this.showStatus('Error: ' + err.message, true);
                }
            },

            async importDb() {
                try {
                    const fileInput = document.createElement('input');
                    fileInput.type = 'file';
                    fileInput.accept = '.sqlite';
                    fileInput.style.display = 'none';
                    document.body.appendChild(fileInput);

                    fileInput.addEventListener('change', async (e) => {
                        if (e.target.files.length === 0) return;

                        const file = e.target.files[0];
                        const reader = new FileReader();

                        reader.onload = async (event) => {
                            try {
                                const uint8Array = new Uint8Array(event.target.result);
                                this.state.db = new this.state.SQL.Database(uint8Array);
                                await this.saveToIdb();

                                // Reset state
                                this.state.openDocs = [];
                                this.state.activeTabIndex = 0;

                                // Load documents
                                await this.loadDocuments();

                                if (this.state.openDocs.length > 0) {
                                    await this.switchToDocument(this.state.openDocs[0].id);
                                    this.showStatus('Database imported successfully');
                                } else {
                                    this.showStatus('Imported database has no documents', true);
                                    await this.newDoc();
                                }
                            } catch (err) {
                                console.error('Import processing error:', err);
                                this.showStatus('Invalid database file', true);
                            }
                            document.body.removeChild(fileInput);
                        };

                        reader.onerror = () => {
                            this.showStatus('Error reading file', true);
                            document.body.removeChild(fileInput);
                        };

                        reader.readAsArrayBuffer(file);
                    });

                    fileInput.click();
                } catch (err) {
                    console.error('Import error:', err);
                    this.showStatus('Error: ' + err.message, true);
                }
            },

            // Reset database
            resetDb() {
                if (confirm('Reset database? This will delete all documents and revisions!')) {
                    try {
                        // Create a new empty database
                        this.state.db = new this.state.SQL.Database();

                        // Re-create the schema
                        this.state.db.run(`
                            CREATE TABLE IF NOT EXISTS documents (
                                id INTEGER PRIMARY KEY AUTOINCREMENT,
                                title TEXT DEFAULT 'Untitled Document',
                                created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
                            )
                        `);
                        this.state.db.run(`
                            CREATE TABLE IF NOT EXISTS revisions (
                                id INTEGER PRIMARY KEY AUTOINCREMENT,
                                document_id INTEGER,
                                content TEXT,
                                timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                                FOREIGN KEY (document_id) REFERENCES documents (id)
                            )
                        `);
                        this.state.db.run(`
                            CREATE TABLE IF NOT EXISTS app_state (
                                key TEXT PRIMARY KEY,
                                value TEXT
                            )
                        `);

                        // Save empty database to IndexedDB
                        this.saveToIdb().then(() => {
                            // Reset state variables
                            this.state.docId = null;
                            this.state.revId = null;
                            this.state.saved = '';
                            this.state.fingerprint = '';
                            this.state.openDocs = [];
                            this.state.activeTabIndex = 0;

                            // Clear editor
                            this.dom.editor.value = '';

                            // Create new document
                            this.newDoc();

                            this.showStatus('Database reset successfully');
                        });
                    } catch (err) {
                        console.error('Reset error:', err);
                        this.showStatus('Error resetting database: ' + err.message, true);
                    }
                }
            },

            formatDate(dateStr) {
                const date = new Date(dateStr);
                if (isNaN(date.getTime())) return dateStr;

                const now = new Date();
                const yesterday = new Date(now);
                yesterday.setDate(now.getDate() - 1);

                if (date.toDateString() === now.toDateString()) {
                    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }

                if (date.toDateString() === yesterday.toDateString()) {
                    return 'Yesterday, ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }

                return date.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' +
                       date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            },

            showStatus(msg, isError = false) {
                this.dom.status.textContent = msg;
                this.dom.status.style.color = isError ? '#e53935' : 'var(--pantone-grey-dark)';
                this.dom.status.style.backgroundColor = isError ? 'rgba(229, 57, 53, 0.1)' : 'rgba(255, 179, 0, 0.1)';
                this.dom.status.classList.add('visible');

                if (this.timers.status) clearTimeout(this.timers.status);

                this.timers.status = setTimeout(() => {
                    this.dom.status.classList.remove('visible');
                }, 2000);
            },

            // Enable debug mode with detailed logging
            enableDebug(options = {}) {
                // Enable debug mode
                this.state.debug = true;
                console.log('Debug mode enabled');

                // Store debug options
                this.state.debugOptions = {
                    verbose: options.verbose || false,
                    tabRename: options.tabRename || false,
                    ...options
                };

                console.log('Debug options:', this.state.debugOptions);

                // Display current autosave thresholds
                const metrics = this.state.typingMetrics;
                console.log('===== Make-Sense Autosave Settings =====');
                console.log(`- Pause threshold: ${metrics.pauseThreshold}ms`);
                console.log(`- Content change threshold: ${metrics.contentChangeThreshold} characters`);
                console.log(`- Average typing rate: ${Math.round(metrics.avgTypingRate)} chars/min`);
                console.log(`- Rate history samples: ${metrics.typingRateHistory.length}`);
                console.log(`- Session started: ${new Date(metrics.sessionStartTime).toLocaleTimeString()}`);

                // Add live monitoring of typing metrics
                const originalHandleInput = this.handleInput;
                this.handleInput = function() {
                    originalHandleInput.apply(this, arguments);

                    // Only log at most once per second to prevent console flood
                    const now = Date.now();
                    if (!this._lastDebugLog || now - this._lastDebugLog > 1000) {
                        this._lastDebugLog = now;
                        console.log(`[Typing] Avg rate: ${Math.round(metrics.avgTypingRate)} chars/min, ` +
                                    `Thresholds: pause=${metrics.pauseThreshold}ms, ` +
                                    `change=${metrics.contentChangeThreshold} chars`);
                    }
                };

                // Log save operations
                const originalSave = this.save;
                this.save = async function(manual = false) {
                    console.log(`[Save] Triggered: ${manual ? 'manual' : 'auto'}`);
                    console.log(`- Editor content length: ${this.dom.editor.value.length} chars`);
                    console.log(`- Saved content length: ${this.state.saved.length} chars`);
                    console.log(`- Change size: ${Math.abs(this.dom.editor.value.length - this.state.saved.length)} chars`);
                    await originalSave.apply(this, arguments);
                    console.log(`[Save] Completed`);
                };

                // Enhanced tab rename debugging
                if (this.state.debugOptions.tabRename) {
                    console.log('==== Tab Rename Debugging Enabled ====');

                    // Enhance the click handlers with extra verbose logging
                    const originalSetupTabRenameHandlers = this.setupTabRenameHandlers;
                    this.setupTabRenameHandlers = () => {
                        console.log('[TabRename] Setting up tab rename handlers');
                        originalSetupTabRenameHandlers.call(this);

                        // Add more diagnostics to each tab title
                        document.querySelectorAll('.tab-title').forEach(title => {
                            // Add a visual indicator for debugging
                            title.style.outline = '1px dashed rgba(58, 134, 255, 0.3)';

                            console.log('[TabRename] Configured handler for:', title.textContent);

                            // Add direct click handler for diagnostics
                            title.addEventListener('click', (e) => {
                                console.log('[TabRename] Click detected on tab title:', title.textContent);
                                console.log('[TabRename] Current activeElement:', document.activeElement);
                                console.log('[TabRename] Event details:', {
                                    type: e.type,
                                    target: e.target,
                                    currentTarget: e.currentTarget,
                                    eventPhase: e.eventPhase
                                });
                            });
                        });
                    };

                    // Enhance start rename with more logging
                    const originalStartTabRename = this.startTabRename;
                    this.startTabRename = (titleEl) => {
                        console.log('[TabRename] Starting rename operation for:', titleEl.textContent);
                        console.log('[TabRename] Active element before rename:', document.activeElement);

                        // Capture DOM state before rename
                        const tabsHTML = this.dom.tabs.innerHTML;
                        console.log('[TabRename] Current tabs container HTML:', tabsHTML.substring(0, 300) + '...');

                        // Call original function
                        originalStartTabRename.call(this, titleEl);

                        // Log post-operation state
                        console.log('[TabRename] Active element after rename:', document.activeElement);
                        console.log('[TabRename] Input element created:', document.querySelector('.tab-edit-input'));

                        // Monitor focus changes
                        const focusMonitor = setInterval(() => {
                            console.log('[TabRename] Focus monitor - active element:', document.activeElement);
                            const input = document.querySelector('.tab-edit-input');
                            if (!input) {
                                console.log('[TabRename] Input element no longer exists, stopping monitor');
                                clearInterval(focusMonitor);
                            }
                        }, 500);

                        // Clear monitor after 5 seconds
                        setTimeout(() => clearInterval(focusMonitor), 5000);
                    };

                    // Run initial setup
                    this.setupTabRenameHandlers();
                }

                // Return useful information and helper functions
                return {
                    metrics: metrics,
                    toggleDebug: () => { this.state.debug = !this.state.debug; return this.state.debug; },
                    enableTabRenameDebug: () => {
                        this.state.debugOptions.tabRename = true;
                        console.log('Tab rename debugging enabled. Run setupTabRenameHandlers() to apply to existing tabs.');
                        return true;
                    },
                    disableTabRenameDebug: () => {
                        this.state.debugOptions.tabRename = false;
                        console.log('Tab rename debugging disabled');
                        return false;
                    }
                };
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
